
<section class="page-banner">
  <span>RESTONS EN CONTACT</span>
  <h1>Nous aimerions entendre ton histoire.</h1>
</section>

<section class="contact container">
  <div class="contact-info">
    <h2>Parlons ensemble.</h2>
    <p>Une question, une suggestion ou simplement envie d'échanger ? Écris-nous.</p>

    <div class="info-item"><i class="fas fa-envelope"></i> contact@estimeetsoi.com</div>
    <div class="info-item"><i class="fas fa-heart"></i> Ensemble vers le mieux-être</div>
  </div>

  <form action="mailto:contact@estimeetsoi.com" method="post" enctype="text/plain">
    <label>Nom complet</label>
    <input type="text" name="nom" placeholder="Ton nom" required>

    <label>Adresse e-mail</label>
    <input type="email" name="email" placeholder="Ton adresse e-mail" required>

    <label>Sujet</label>
    <input type="text" name="sujet" placeholder="Sujet du message" required>

    <label>Ton message</label>
    <textarea name="message" rows="5" placeholder="Écris ton message..." required></textarea>

    <button type="submit">Envoyer mon message <i class="fas fa-arrow-right"></i></button>
  </form>
</section>
